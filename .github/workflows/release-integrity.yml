name: release-integrity

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify annotated tag and production convergence
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          git fetch --no-tags origin main production
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/remotes/origin/release-tag"
          test "$(git cat-file -t refs/remotes/origin/release-tag)" = tag
          main_sha="$(git rev-parse origin/main)"
          production_sha="$(git rev-parse origin/production)"
          tag_sha="$(git rev-parse refs/remotes/origin/release-tag^{})"
          test "$main_sha" = "$production_sha"
          test "$main_sha" = "$tag_sha"
          echo "Converged at $main_sha"
